<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    MPC Sprocket Favicon — Motion Plus Corporation
    Faithfully reproduces the circular gear icon from the official logo:
      · Dark-navy 10-tooth gear body (fill-rule evenodd cuts a clean inner circle)
      · Lighter-blue inner fill matches the brand light-blue accent
      · White ring outline + upward arrow  ← the centre emblem from the mark
  -->

  <!-- ① Gear body (dark navy) + inner-circle hole via evenodd -->
  <path
    fill="#0d1e40"
    fill-rule="evenodd"
    d="M 44.857,13.864
       L 42.005,4.192
       L 57.995,4.192
       L 55.143,13.864
       L 67.079,17.743
       L 70.457,8.242
       L 83.393,17.640
       L 75.401,23.788
       L 82.778,33.942
       L 91.095,28.241
       L 96.036,43.448
       L 85.956,43.725
       L 85.956,56.275
       L 96.036,56.552
       L 91.095,71.759
       L 82.778,66.058
       L 75.401,76.212
       L 83.393,82.360
       L 70.457,91.758
       L 67.079,82.257
       L 55.143,86.136
       L 57.995,95.808
       L 42.005,95.808
       L 44.857,86.136
       L 32.921,82.257
       L 29.543,91.758
       L 16.607,82.360
       L 24.599,76.212
       L 17.222,66.058
       L  8.905,71.759
       L  3.964,56.552
       L 14.044,56.275
       L 14.044,43.725
       L  3.964,43.448
       L  8.905,28.241
       L 17.222,33.942
       L 24.599,23.788
       L 16.607,17.640
       L 29.543,8.242
       L 32.921,17.743 Z
       M 50,20.5 A 29.5,29.5 0 1 0 50,79.5 A 29.5,29.5 0 1 0 50,20.5 Z"
  />

  <!-- ② Lighter-blue ring — fills the gear's inner circle, forms the colour band -->
  <circle cx="50" cy="50" r="29.5" fill="#4A90E2"/>

  <!-- ③ Dark-navy centre disc — punches back to create the blue ring width -->
  <circle cx="50" cy="50" r="19" fill="#0d1e40"/>

  <!-- ④ Lighter-blue inner disc — second blue layer (matches logo inner circle) -->
  <circle cx="50" cy="50" r="14" fill="#4A90E2"/>

  <!-- ⑤ White ring outline — the decorative circle stroke on the centre emblem -->
  <circle cx="50" cy="50" r="22.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- ⑥ White upward-arrow (the emblem at the very centre of the logo) -->
  <!-- Arrow head (triangle pointing up) -->
  <polygon points="50,27 41.5,40 58.5,40" fill="#ffffff"/>
  <!-- Arrow shaft -->
  <rect x="46.5" y="39" width="7" height="11" rx="1" fill="#ffffff"/>
</svg>
