<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <!--
    Motion Plus Corporation — official logo favicon
    Embeds mpc-logo.jpg via SVG <image> so every modern browser
    (Chrome, Edge, Firefox, Safari) shows the real company logo
    in browser tabs, bookmarks, and mobile home-screen shortcuts.
    White background ensures the logo reads cleanly on both light
    and dark browser chrome.
  -->
  <rect width="100" height="100" rx="14" fill="#ffffff"/>
  <image
    href="mpc-logo.jpg"
    x="4" y="4"
    width="92" height="92"
    preserveAspectRatio="xMidYMid meet"
  />
</svg>
