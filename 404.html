<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Page Not Found | Motion Plus Corporation</title>
  <link rel="shortcut icon" href="favicon.ico?v=8" type="image/x-icon">
  <link rel="icon" href="favicon-32.png?v=8" type="image/png" sizes="32x32">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', 'Calibri', Arial, sans-serif;
      background: #0b1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 520px; }
    .code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: 1;
      background: linear-gradient(135deg, #0056a4, #7ec8e3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .msg {
      font-size: 1.15rem;
      font-weight: 700;
      color: rgba(255,255,255,.85);
      margin: .75rem 0 .5rem;
    }
    .sub {
      font-size: .92rem;
      color: rgba(255,255,255,.45);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btns { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .75rem 1.6rem;
      border-radius: 100px;
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
      transition: all .2s;
    }
    .btn-primary {
      background: #0056a4;
      color: #fff;
    }
    .btn-primary:hover { background: #003d7a; box-shadow: 0 8px 24px rgba(0,86,164,.35); }
    .btn-outline {
      background: transparent;
      color: rgba(255,255,255,.7);
      border: 1.5px solid rgba(255,255,255,.2);
    }
    .btn-outline:hover { border-color: rgba(255,255,255,.5); color: #fff; }
    .logo {
      width: 140px;
      margin: 0 auto 2rem;
      opacity: .7;
    }
    .logo img { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="mpc-logo.jpg" alt="Motion Plus Corporation"></div>
    <div class="code">404</div>
    <p class="msg">Page Not Found</p>
    <p class="sub">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="btns">
      <a href="index.html" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Go Home
      </a>
      <a href="products.html" class="btn btn-outline">Our Products</a>
      <a href="contact.html" class="btn btn-outline">Contact Us</a>
    </div>
  </div>
</body>
</html>
